<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <link rel="stylesheet" href="assets/styles/login.css" />
  <script type="module" src="assets/components/navbar.js"></script>
  <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">

</head>

<body>
  <nav-bar></nav-bar>
  <!-- Centered Layout Container -->
  <main class="container flex-grow-1 d-flex flex-column justify-content-center align-items-center py-5">

    <!-- Auth Card -->
    <div class="card auth-card shadow-lg border-0 overflow-hidden">

      <!-- Top Decorative Accent -->
      <div class="bg-primary-custom py-2"></div>

      <div class="card-body p-4 p-sm-5">

        <!-- Heading Header -->
        <div class="text-center mb-4">
          <img
            class="w-25 d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3"
            src="assets/images/logo.jpg" alt="logo">
          <h1 class="fw-bold text-dark mb-1">School of Computing</h1>
          <p class="text-muted small">
            Enter your account email to receive a verification PIN.
          </p>
        </div>

        <!-- Auth Form -->
        <form id="otpForm" onsubmit="event.preventDefault()">

          <!-- Email Input -->
          <div class="mb-3">
            <label for="emailInput" class="form-label small fw-semibold text-secondary">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" class="form-control border-start-0 ps-0" id="emailInput"
                placeholder="JohnDoe@ichat.sp.edu.sg" required />
            </div>
          </div>

          <!-- Send PIN Button -->
          <div class="d-grid mb-4">
            <button type="button" class="btn btn-outline-primary btn-sm fw-semibold rounded-pill py-2" id="sendPinBtn">
              Send One-Time PIN
            </button>
          </div>

          <div class="position-relative my-4">
            <hr class="text-muted opacity-25 m-0" />
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">PIN
              Verification</span>
          </div>

          <!-- One Time PIN Section -->
          <div class="mb-4 text-center">
            <div class="d-flex justify-content-center gap-2" id="otpInputs">
              <input type="text" maxlength="1" class="otp-input form-control text-center" required />
              <input type="text" maxlength="1" class="otp-input form-control text-center" required />
              <input type="text" maxlength="1" class="otp-input form-control text-center" required />
              <input type="text" maxlength="1" class="otp-input form-control text-center" required />
              <input type="text" maxlength="1" class="otp-input form-control text-center" required />
              <input type="text" maxlength="1" class="otp-input form-control text-center" required />
            </div>
          </div>

          <!-- Verify Button -->
          <div class="d-grid">
            <button type="submit" class="btn btn-primary bg-primary-custom rounded-pill py-2 fw-semibold shadow-sm">
              Verify PIN
            </button>
          </div>

        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script type="module" src="assets/scripts/login.js"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
