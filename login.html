<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      @view-transition {navigation: auto;
      }
    </style>
    <link rel="stylesheet" href="assets/styles/global.css" />
    <script type="module" src="./assets/components/navbar.js"></script>

    <link rel="stylesheet" href="assets/styles/login.css" />
  </head>
  <body>
    <nav-bar></nav-bar>
    <main class="container-fluid h-100 position-relative pt-5">
      <!-- Main Heading -->
      <div class="text-center mb-4">
        <h1
          class="fw-extrabold text-primary display-5 text-uppercase tracking-wide"
        >
          Welcome to School of Computing
        </h1>
        <p class="text-muted">
          Enter your account email to receive a verification pin.
        </p>
      </div>

      <!-- Auth Card -->
      <div class="d-flex justify-content-center">
        <div class="card auth-card p-4 p-md-5">
          <form id="otpForm" onsubmit="event.preventDefault()">
            <!-- Email Input -->
            <div class="mb-4">
              <label
                for="emailInput"
                class="form-label fw-semibold text-secondary"
                >Email Address</label
              >
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"
                  ><i class="bi bi-envelope"></i
                ></span>
                <input
                  type="email"
                  class="form-control"
                  id="emailInput"
                  placeholder="JohnDoe@ichat.sp.edu.sg"
                  required
                />
              </div>
            </div>

            <!-- Send PIN Button -->
            <div class="d-grid mb-4">
              <button
                type="button"
                class="btn btn-outline-primary fw-medium rounded-pill py-2"
                id="sendPinBtn"
              >
                Send One-Time Pin
              </button>
            </div>

            <hr class="my-4 text-muted opacity-25" />

            <!-- One Time Pin Section -->
            <div class="mb-4 text-center">
              <label class="form-label fw-semibold text-secondary d-block mb-3"
                >One-Time Pin</label
              >
              <div class="d-flex justify-content-center gap-2" id="otpInputs">
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input form-control"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input form-control"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input form-control"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input form-control"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input form-control"
                  required
                />
                <input
                  type="text"
                  maxlength="1"
                  class="otp-input form-control"
                  required
                />
              </div>
            </div>

            <!-- Verify Button -->
            <div class="d-grid">
              <button
                type="submit"
                class="btn btn-primary bg-primary-custom rounded-pill py-2.5 fw-semibold shadow-sm"
              >
                Verify Pin
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
