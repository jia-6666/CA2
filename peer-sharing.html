<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peer Sharing — School of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
  rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles/global.css" />
  <script type="module" src="assets/components/navbar.js"></script>
  <link rel="stylesheet" href="assets/styles/peer-sharing.css" />
</head>

<body>
  <nav-bar></nav-bar>
  <main class="layout">
    <div class="main-col">

      <!-- Composer -->
      <section class="composer-card">
        <input type="text" id="composerInput" class="composer-input"
          placeholder="Share something new… (a title or caption)" maxlength="140">

        <div class="composer-detail" id="composerDetail" hidden></div>
        <input type="file" id="composerFileInput" accept="image/*" hidden>

        <div class="composer-actions">
          <button class="composer-btn" type="button" data-kind="image">
            <i class="bi bi-image"></i> Upload Image
          </button>
          <button class="composer-btn" type="button" data-kind="github">
            <i class="bi bi-github"></i> GitHub Link
          </button>
          <button class="composer-btn" type="button" data-kind="demo">
            <i class="bi bi-display"></i> Project Demo
          </button>
          <button class="composer-post" id="composerPost" type="button">Post</button>
        </div>
        <p class="composer-hint" id="composerHint" hidden></p>
      </section>

      <!-- Showcase / Life toggle -->
      <div class="section-tabs">
        <button class="tab active" data-tab="showcase">Student Projects Showcase</button>
        <button class="tab" data-tab="life">Life Outside Classroom</button>
      </div>

      <section class="tab-panel" id="panel-showcase">
        <div class="showcase-grid" id="showcaseGrid"></div>
      </section>

      <section class="tab-panel" id="panel-life" hidden>
        <div class="masonry" id="lifeFeed"></div>
      </section>
    </div>

    <aside class="side-col">
      <div class="side-card">
        <h3>Top Shares This Week</h3>
        <ol class="leaderboard" id="leaderboard"></ol>
      </div>
      <div class="side-card highlight-card">
        <p class="eyebrow light">Pinned</p>
        <h3>Studying Resources</h3>
        <p class="side-sub">Curated notes, past papers &amp; the LeetCode grind list, kept up to date by seniors.</p>
        <a class="side-cta" href="resources.html">Open collection <i class="bi bi-arrow-right"></i></a>
        <ul class="pinned-list" id="pinnedList"></ul>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/scripts/peer-sharing.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
