<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peer Sharing — School of Computing</title>
    <style>
      @view-transition {navigation: auto;
      }
    </style>
    <link rel="stylesheet" href="assets/styles/global.css" />
    <script type="module" src="./assets/components/navbar.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles/peer-sharing.css" />
  </head>
  <body>
    <nav-bar></nav-bar>

    <main class="layout">
      <div class="main-col">
        <!-- Composer -->
        <section class="composer-card">
          <input
            type="text"
            id="composerInput"
            class="composer-input"
            placeholder="Share something new…"
            maxlength="140"
          />
          <div class="composer-actions">
            <button class="composer-btn" data-kind="image">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M12 3v14M5 10l7-7 7 7" />
                <path d="M4 21h16" />
              </svg>
              Upload Image
            </button>
            <button class="composer-btn" data-kind="github">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M12 .5C5.7.5.9 5.3.9 11.6c0 5 3.2 9.2 7.7 10.7.6.1.8-.2.8-.6v-2.1c-3.1.7-3.8-1.5-3.8-1.5-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.6.1-.6 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.5.1-3.1 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.6.2 2.8.1 3.1.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5.1 5.5.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.5-1.5 7.7-5.7 7.7-10.7C23.1 5.3 18.3.5 12 .5z"
                />
              </svg>
              GitHub Link
            </button>
            <button class="composer-btn" data-kind="demo">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="3" y="4" width="18" height="13" rx="2" />
                <path d="M9 21h6M12 17v4" />
              </svg>
              Project Demo
            </button>
            <button class="composer-post" id="composerPost">Post</button>
          </div>
        </section>

        <!-- Showcase / Life toggle -->
        <div class="section-tabs">
          <button class="tab active" data-tab="showcase">
            Student Projects Showcase
          </button>
          <button class="tab" data-tab="life">Life Outside Classroom</button>
        </div>

        <section class="tab-panel" id="panel-showcase">
          <div class="showcase-grid" id="showcaseGrid"></div>
        </section>

        <section class="tab-panel" id="panel-life" hidden>
          <div class="masonry" id="lifeFeed"></div>
        </section>
      </div>

      <aside class="side-col">
        <div class="side-card">
          <h3>Top Shares This Week</h3>
          <ol class="leaderboard" id="leaderboard"></ol>
        </div>
        <div class="side-card highlight-card">
          <p class="eyebrow light">Pinned</p>
          <h3>Studying Resources</h3>
          <p class="side-sub">
            Curated notes, past papers &amp; the LeetCode grind list, kept up to
            date by seniors.
          </p>
          <button class="side-cta">Open collection →</button>
        </div>
      </aside>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script src="assets/scripts/peer-sharing.js"></script>
        <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/scripts/recent-visits.js"></script>
  </body>
</html>
