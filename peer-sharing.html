<body>
  <nav-bar></nav-bar>
  <main class="layout">
    <h1 style="display: none;">Peer Sharing</h1>
    <div class="main-col">

      <!-- Composer -->
      <div class="composer-card">
        <input type="text" id="composerInput" class="composer-input"
          placeholder="Share something new… (a title or caption)" maxlength="140">

        <div class="composer-detail" id="composerDetail" hidden></div>
        <input type="file" id="composerFileInput" accept="image/*" hidden>

        <div class="composer-actions">
          <button class="composer-btn" type="button" data-kind="image">
            <i class="bi bi-image"></i> Upload Image
          </button>
          <button class="composer-btn" type="button" data-kind="github">
            <i class="bi bi-github"></i> GitHub Link
          </button>
          <button class="composer-btn" type="button" data-kind="demo">
            <i class="bi bi-display"></i> Project Demo
          </button>
          <label class="composer-dest">
          <span>Post to</span>
          <select id="composerDest" aria-label="Where should this be posted?">
            <option value="life">Life Outside Classroom</option>
            <option value="showcase">Student Projects Showcase</option>
          </select>
        </label> 
        <label class="composer-dest">
          <span>Tag</span>
          <select id="composerTag" aria-label="Tag your post">
            <option value="Meme">Meme</option>
            <option value="School">School</option>
            <option value="Resource">Resource</option>
            <option value="Rant">Rant</option>
            <option value="Life">Life</option>
            <option value="Photo">Photo</option>
          </select>
        </label>
        <button class="composer-post" id="composerPost" type="button">Post</button>
        </div>
        <p class="composer-hint" id="composerHint" hidden></p>
      </div>

      <!-- Showcase / Life toggle -->
      <div class="section-tabs">
        <button class="tab active" data-tab="showcase">Student Projects Showcase</button>
        <button class="tab" data-tab="life">Life Outside Classroom</button>
      </div>

      <div class="tab-panel" id="panel-showcase">
        <div class="showcase-grid" id="showcaseGrid"></div>
      </div>

      <div class="tab-panel" id="panel-life" hidden>
      <div class="filter-chips" id="lifeFilterChips">
        <button class="chip active" data-tag="all">All</button>
        <button class="chip" data-tag="Meme">Meme</button>
        <button class="chip" data-tag="School">School</button>
        <button class="chip" data-tag="Resource">Resource</button>
        <button class="chip" data-tag="Rant">Rant</button>
        <button class="chip" data-tag="Life">Life</button>
        <button class="chip" data-tag="Photo">Photo</button>
      </div>
      <div class="masonry" id="lifeFeed"></div>
    </div>
    </div>

    <aside class="side-col">
      <div class="side-card">
        <h2>Top Shares This Week</h2>
        <ol class="leaderboard" id="leaderboard"></ol>
      </div>
      <div class="side-card highlight-card">
        <p class="eyebrow light">Pinned</p>
        <h2>Studying Resources</h2>
        <p class="side-sub">Curated notes, past papers &amp; the LeetCode grind list, kept up to date by seniors.</p>
        <ul class="pinned-list" id="pinnedList"></ul>
      </div>
    </aside>
  </main>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close image"><i class="bi bi-x-lg"></i></button>
    <img id="lightboxImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Enlarged image">
  </div>

  <div class="toast" id="toast" role="status"></div>
