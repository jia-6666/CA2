<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wellness Check-In — School of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles/global.css" />
  <script type="module" src="assets/components/navbar.js"></script>
  <link rel="stylesheet" href="assets/styles/peer-support.css" />
</head>

<body>
  <nav-bar></nav-bar>

  <main>

    <!-- ===== Wellness gauge ===== -->
    <section class="gauge-card" id="gaugeCard" tabindex="-1">
      <p class="eyebrow light">Daily Wellness Check-In</p>
      <h2>How's your semester going right now?</h2>

      <div class="gauge-row">
        <span class="face" aria-hidden="true"><i class="bi bi-emoji-frown"></i></span>

        <div class="slider-wrap">
          <input type="range" id="moodSlider" min="0" max="100" value="55" aria-label="Wellness level">
          <div class="slider-track">
            <div class="slider-fill" id="sliderFill"></div>
          </div>
        </div>

        <span class="face" aria-hidden="true"><i class="bi bi-emoji-smile"></i></span>
      </div>
      <div class="gauge-labels">
        <span>Burnt Out</span>
        <span id="moodWord">Cruising</span>
        <span>Thriving</span>
      </div>

      <div class="recommend-card" id="recommendCard">
        <div class="recommend-head">
          <p class="recommend-title">Recommended for you</p>
          <!-- Mobile/portrait-only dropdown toggle: the recommendation list can
             run long and pushes the rest of the page down on small screens,
             so it's collapsed by default there and the user chooses to open it. -->
          <button type="button" class="recommend-toggle" id="recommendToggle" aria-expanded="false"
            aria-controls="recommendItems">
            <span class="recommend-toggle-label">Show suggestions</span>
            <i class="bi bi-chevron-down"></i>
          </button>
        </div>
        <div class="recommend-items" id="recommendItems"></div>
      </div>
    </section>

    <!-- ===== Study group map ===== -->
    <section class="panel" id="mapSection">
      <div class="panel-head">
        <h2>Study Group Map</h2>
        <button class="pin-btn" id="pinBtn">
          <i class="bi bi-geo-alt"></i>
          Pin my study spot
        </button>
      </div>
      <p class="panel-sub">Live spots students have checked into today. Click the map to drop your own pin.</p>

      <!-- ===== Zoomable/pannable map viewport =====
         mapViewport clips overflow and stays a fixed size; mapFrame is the
         layer that actually gets scaled/translated by peer-support.js so the
         map (which is quite small on portrait/mobile screens) can be zoomed
         in for a closer look and panned around while zoomed. -->
      <div class="map-viewport" id="mapViewport">
        <div class="map-frame" id="mapFrame">
          <img class="campus-map-img" src="assets/images/navigation/campus-map.jpg" alt="Campus map">
          <div class="pins-layer" id="pinsLayer"></div>
        </div>
        <div class="map-controls" id="mapControls">
          <button type="button" id="zoomInBtn" aria-label="Zoom in"><i class="bi bi-plus-lg"></i></button>
          <button type="button" id="zoomOutBtn" aria-label="Zoom out"><i class="bi bi-dash-lg"></i></button>
          <button type="button" id="zoomResetBtn" aria-label="Reset zoom"><i
              class="bi bi-arrows-angle-contract"></i></button>
        </div>
        <span class="map-zoom-hint" id="mapZoomHint">Pinch, scroll, or use the buttons to zoom</span>
      </div>

      <div class="pin-list" id="pinList"></div>
    </section>

    <!-- ===== Q&A ===== -->
    <section class="panel" id="qaSection">
      <div class="panel-head">
        <h2>Urgent Blockers Q&amp;A</h2>
        <div class="qa-sort">
          <button class="chip active" data-qa-sort="top">Top</button>
          <button class="chip" data-qa-sort="unanswered">Unanswered</button>
          <button class="chip" data-qa-sort="new">Newest</button>
        </div>
      </div>

      <form class="qa-form" id="qaForm">
        <select id="qaSubject" aria-label="Subject">
          <option>Python</option>
          <option>Algorithms</option>
          <option>Databases</option>
          <option>Web Dev</option>
          <option>Career</option>
        </select>
        <input type="text" id="qaInput" placeholder="Stuck on something? Ask the cohort…" maxlength="120" required>
        <button type="submit">Post question</button>
      </form>

      <div class="qa-list" id="qaList"></div>
    </section>

  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="assets/scripts/comments.js"></script>
  <script src="assets/scripts/peer-support.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
