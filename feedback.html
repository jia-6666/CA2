<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suggestion Board — School of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles/global.css" />
  <script type="module" src="assets/components/navbar.js"></script>
  <link rel="stylesheet" href="assets/styles/comments.css">
  <link rel="stylesheet" href="assets/styles/feedback.css">
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  
</head>

<body>
  <nav-bar></nav-bar>

  <main>
    <section class="hero">
      <p class="eyebrow">Suggestion Board</p>
      <h1>What should we fix next?</h1>
      <p class="hero-sub">Post an idea, back the ones you're behind, and watch it climb the board. Anything that crosses
        100 votes gets picked up by Student Council within the week.</p>
      <div class="hero-stats">
        <div class="stat"><strong id="statTotal">0</strong><span>ideas live</span></div>
        <div class="stat"><strong id="statImplemented">0</strong><span>implemented</span></div>
        <div class="stat"><strong id="statVotes">0</strong><span>votes cast</span></div>
      </div>
    </section>

    <section class="controls">
      <div class="filter-chips" id="filterChips">
        <button class="chip active" data-filter="all">All ideas</button>
        <button class="chip" data-filter="Facilities">Facilities</button>
        <button class="chip" data-filter="Academics">Academics</button>
        <button class="chip" data-filter="Wellness">Wellness</button>
        <button class="chip" data-filter="Tech">Tech</button>
        <button class="chip" data-filter="Events">Events</button>
      </div>
      <label class="sort-wrap">
        <span>Sort by</span>
        <select id="sortSelect">
          <option value="top">Top Voted</option>
          <option value="new">Newest</option>
          <option value="discussed">Most Discussed</option>
        </select>
      </label>
    </section>

    <section class="board" id="board" aria-live="polite"></section>
    <p class="empty-state" id="emptyState" hidden>No ideas here yet — be the first to post one below.</p>

    <form class="composer" id="composerForm">
      <select id="composerCategory" aria-label="Category">
        <option>Facilities</option>
        <option>Academics</option>
        <option>Wellness</option>
        <option>Tech</option>
        <option>Events</option>
      </select>
      <input type="text" id="composerInput" placeholder="Share your thought…" maxlength="140" required>
      <button type="submit">Post</button>
    </form>

    <div class="toast" id="toast" role="status"></div>
  </main>

  <script src="assets/scripts/comments.js"></script>
  <script src="assets/scripts/feedback.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
