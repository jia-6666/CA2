<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <link rel="stylesheet" href="assets/styles/announcement.css">
  <script type="module" src="./assets/components/navbar.js"></script>
</head>

<body>
  <nav-bar></nav-bar>
  <main>
    <section class="hero-section">
      <!-- 3D Slideshow Section -->
      <section class="carousel">
        <figure class="item"><img
            src="https://images.pexels.com/photos/758733/pexels-photo-758733.jpeg?w=940&h=650&auto=compress&cs=tinysrgb" />
        </figure>
        <figure class="item"><img
            src="https://images.pexels.com/photos/21261/pexels-photo.jpg?w=940&h=650&auto=compress&cs=tinysrgb" />
        </figure>
        <figure class="item"><img
            src="https://images.pexels.com/photos/567973/pexels-photo-567973.jpeg?w=940&h=650&auto=compress&cs=tinysrgb" />
        </figure>
      </section>
    </section>

    <!-- All Events Section -->
    <section class="all-events-section" id="all-events">
      <div class="container">

        <!-- Section Controls -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="section-title">All Events:</h2>

          <div class="dropdown">
            <button class="btn btn-sort dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              Sort By (asc)
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#">Sort By (asc)</a></li>
              <li><a class="dropdown-item" href="#">Sort By (desc)</a></li>
              <li><a class="dropdown-item" href="#">Date</a></li>
            </ul>
          </div>
        </div>

        <!-- Event Card -->
        <div class="custom-card">
          <div class="card-img-placeholder">
            Img
          </div>
          <div class="card-content">
            <div>
              <div class="card-title-text">Title</div>
              <div class="card-desc-text">Description...</div>
            </div>
            <button class="btn btn-card-signup">Sign Up</button>
          </div>
        </div>

      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
