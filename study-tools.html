<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - School Of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <link rel="stylesheet" href="assets/styles/tools.css" />
  <script type="module" src="./assets/components/navbar.js"></script>
</head>

<body>
  <nav-bar></nav-bar>
  <main class="container my-5">

    <!-- Section 1: Pomodoro Timer -->
    <section class="mb-5">
      <h1 class="section-title mb-4">Pomodoro Timer</h1>
      <div class="tool-card p-4">
        <div class="row align-items-center">

          <!-- Left Side: Timer Controls -->
          <div class="col-md-8 border-end-md pe-md-4">
            <div class="d-flex align-items-center justify-content-center gap-3 my-4">
              <button class="btn btn-timer-control" id="decreaseTime">-</button>
              <div class="timer-display" id="timerDisplay">00:00:00</div>
              <button class="btn btn-timer-control" id="increaseTime">+</button>
            </div>

            <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
              <div class="form-check form-switch custom-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="dndSwitch">
                <label class="form-check-label text-white fw-semibold" for="dndSwitch">Do Not Disturb</label>
              </div>
            </div>

            <div class="d-flex justify-content-center">
              <button class="btn btn-start w-50 py-2 fs-5" id="startBtn">Start</button>
            </div>
          </div>

          <!-- Right Side: Task List -->
          <div class="col-md-4 ps-md-4 mt-4 mt-md-0">
            <div class="task-list text-white" id="task-list">
              <button class="btn btn-add-task d-flex align-items-center gap-2 text-white p-0 border-0 bg-transparent"
                id="addTaskBtn">
                <span class="badge bg-primary-dark p-2"><i class="bi bi-plus"></i></span>
                <span>Add new task</span>
              </button>
            </div>
          </div>

        </div>
      </div>
      <dialog id="addTaskMenu" class="p-4 border-0 rounded-3 shadow-lg bg-dark text-white position-absolute top-50 start-50 translate-middle">
        <form id="taskForm" method="dialog">
          <h5 class="mb-3">Add New Task</h5>
          <input type="text" id="taskTitleInput" class="form-control mb-3" placeholder="Enter task name..." required autocomplete="off">
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-secondary btn-sm" id="cancelTaskBtn">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Add Task</button>
          </div>
        </form>
      </dialog>
    </section>

    <!-- Section 2: Flash Cards -->
    <section class="mb-5">
      <h1 class="section-title mb-4">Flash Card</h1>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="flash-card d-flex align-items-center justify-content-center">
            <h3>Module A</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="flash-card d-flex align-items-center justify-content-center">
            <h3>Module B</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="flash-card d-flex flex-column align-items-center justify-content-center cursor-pointer">
            <i class="bi bi-plus-lg display-3"></i>
            <p class="mt-2 text-center text-white-50">Create your own flash cards</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 3: GPA Calculator -->
    <section class="mb-5">
      <h1 class="section-title mb-4">GPA Calculator</h1>
      <div class="tool-card p-4">
        <div class="row align-items-center g-3">

          <div class="col-md-4">
            <select class="form-select custom-select py-2 fs-5" id="moduleSelect">
              <option value="Module A" selected>Module A</option>
              <option value="Module B">Module B</option>
              <option value="Module C">Module C</option>
            </select>
          </div>

          <div class="col-md-8">
            <div class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between text-white fs-5">
                <label for="ca1" class="me-3">CA 1 Grade (40%):</label>
                <input type="text" id="ca1" class="form-control grade-input" style="width: 45%;">
              </div>
              <div class="d-flex align-items-center justify-content-between text-white fs-5">
                <label for="ca2" class="me-3">CA 2 Grade (40%):</label>
                <input type="text" id="ca2" class="form-control grade-input" style="width: 45%;">
              </div>
              <div class="d-flex align-items-center justify-content-between text-white fs-5">
                <label for="ca3" class="me-3">CA 3 Grade (20%):</label>
                <input type="text" id="ca3" class="form-control grade-input" style="width: 45%;">
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="./assets/scripts/tools.js"></script>
</body>

</html>
