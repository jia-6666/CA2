<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - School Of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <link rel="stylesheet" href="assets/styles/tools.css" />
  <script type="module" src="./assets/components/navbar.js"></script>
  <script type="module" src="./assets/components/pomodoro-timer.js"></script>
</head>

<body>
  <nav-bar></nav-bar>
  <main class="container my-5">

    <!-- Section 1: Pomodoro Timer -->
    <pomodoro-timer></pomodoro-timer>

    <!-- Section 2: Flash Cards -->
    <section class="mb-5">
      <h1 class="section-title mb-4">Flash Card</h1>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="flash-card d-flex align-items-center justify-content-center">
            <h3>Module A</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="flash-card d-flex align-items-center justify-content-center">
            <h3>Module B</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="flash-card d-flex flex-column align-items-center justify-content-center cursor-pointer">
            <i class="bi bi-plus-lg display-3"></i>
            <p class="mt-2 text-center text-white-50">Create your own flash cards</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Section 3: GPA Calculator -->
    <section class="mb-5">
      <h1 class="section-title mb-4">GPA Calculator</h1>
      <div class="tool-card p-4">
        <div class="row align-items-center g-3">

          <div class="col-md-4">
            <select class="form-select custom-select py-2 fs-5" id="moduleSelect">
              <option value="Module A" selected>Module A</option>
              <option value="Module B">Module B</option>
              <option value="Module C">Module C</option>
            </select>
          </div>

          <div class="col-md-8">
            <div class="d-flex flex-column gap-3">
              <div class="d-flex align-items-center justify-content-between text-white fs-5">
                <label for="ca1" class="me-3">CA 1 Grade (40%):</label>
                <input type="text" id="ca1" class="form-control grade-input" style="width: 45%;">
              </div>
              <div class="d-flex align-items-center justify-content-between text-white fs-5">
                <label for="ca2" class="me-3">CA 2 Grade (40%):</label>
                <input type="text" id="ca2" class="form-control grade-input" style="width: 45%;">
              </div>
              <div class="d-flex align-items-center justify-content-between text-white fs-5">
                <label for="ca3" class="me-3">CA 3 Grade (20%):</label>
                <input type="text" id="ca3" class="form-control grade-input" style="width: 45%;">
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <!-- <script src="./assets/scripts/tools.js"></script> -->
</body>

</html>
