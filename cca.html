<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCA</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <link rel="stylesheet" href="assets/styles/cca.css">
  <script type="module" src="assets/components/navbar.js"></script>
</head>

<body>
  <nav-bar></nav-bar>
  <main class="container cca-page">
    <!-- Search + category filters -->
    <section class="cca-search-panel mb-2">
      <div class="cca-search-bar d-flex align-items-center gap-3">
        <input type="text" id="ccaSearch" placeholder="Looking for ..." aria-label="Search CCAs" />
        <i class="bi bi-search" aria-hidden="true"></i>
      </div>

      <div class="cca-filters">
        <p class="cca-filters-title mb-2">Categories:</p>
        <div class="d-flex flex-wrap">
          <label class="cca-filter-option">
            <input type="checkbox" class="cca-filter" data-filter="soc" />
            SOC only
          </label>
          <label class="cca-filter-option">
            <input type="checkbox" class="cca-filter" data-filter="watersport" />
            Water sports
          </label>
          <label class="cca-filter-option">
            <input type="checkbox" class="cca-filter" data-filter="sports" />
            Sports
          </label>
          <label class="cca-filter-option">
            <input type="checkbox" class="cca-filter" data-filter="constituent" />
            Constituent Clubs
          </label>
          <label class="cca-filter-option">
            <input type="checkbox" class="cca-filter" data-filter="arts" />
            Arts &amp; Culture
          </label>
          <label class="cca-filter-option">
            <input type="checkbox" class="cca-filter" data-filter="service" />
            Service-Learning
          </label>
          <label class="cca-filter-option">
            <input type="checkbox" class="cca-filter" data-filter="special" />
            Special Interests
          </label>
        </div>
      </div>
    </section>

    <!-- Results meta -->
    <p class="cca-results-meta">
      Showing results for <span id="ccaSearchLabel">all CCAs</span> —
      <span id="ccaResultCount">0 CCAs found</span>
    </p>

    <!-- Card grid, populated by cca.js -->
    <div class="row g-4" id="ccaGrid"></div>

    <!-- Empty state -->
    <div id="ccaEmptyState" class="d-none">
      <i class="bi bi-search" style="font-size: 2rem;"></i>
      <p class="mt-2 mb-0">No CCAs match your search. Try a different keyword or category.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/recent-visits.js"></script>
  <script src="assets/scripts/cca.js"></script>
</body>

</html>
