<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - School Of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <script type="module" src="assets/components/navbar.js"></script>
  <link rel="stylesheet" href="assets/styles/study-dashboard.css" />
</head>

<body>
  <nav-bar></nav-bar>

  <!-- Split Screen Layout Grid -->
  <main class="container-fluid p-3 row gap-3 gap-lg-0">

    <!-- LEFT HALF: Timer & Task UI -->
    <div class="col-lg-6 col-md-6 d-flex flex-column gap-3 h-100">

      <!-- Pomodoro Timer -->
      <div class="card bg-white border-0 shadow-sm p-3 text-center dashboard-card">
        <h4 class="fw-bold mb-2">Pomodoro Timer</h4>

        <!-- Display Controls -->
        <div class="d-flex align-items-center justify-content-center gap-3 my-2">
          <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="decreaseBtn" title="Decrease 5 min">
            <i class="bi bi-dash-lg"></i>
          </button>
          <div class="display-3 fw-bold text-dark timer-num" id="timerDisplay">25:00</div>
          <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="increaseBtn" title="Increase 5 min">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>

        <!-- Time Slider -->
        <div class="px-4 my-2">
          <input type="range" class="form-range" id="timeSlider" min="5" max="45" step="1" value="25">
          <div class="d-flex justify-content-between text-muted small px-1">
            <span>5 min</span>
            <span>25 min</span>
            <span>45 min</span>
          </div>
        </div>

        <!-- Plant Select -->
        <div class="d-flex align-items-center justify-content-center gap-2 mt-2 mb-1">
          <label for="plantSelect" class="form-label small fw-semibold mb-0 text-muted">
            <i class="bi bi-flower1 text-success me-1"></i>Plant Type:
          </label>
          <select id="plantSelect" class="form-select form-select-sm w-auto fw-medium shadow-sm">
            <option value="tree" selected>🌳 Tree</option>
            <option value="rose">🌹 Rose</option>
            <option value="sun-flower">🌻 Sun Flower</option>
          </select>
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-center gap-2 mt-3">
          <button id="startBtn" class="btn btn-success px-4">Start</button>
          <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
        </div>
      </div>

      <!-- Task UI -->
      <div class="card shadow-sm border-0 dashboard-card d-flex flex-column flex-grow-1 overflow-hidden">
        <div class="card-header bg-white border-0 fw-bold fs-5 pt-3 pb-2">
          <i class="bi bi-check2-square me-2 text-primary"></i>Tasks
        </div>
        <div class="card-body d-flex flex-column overflow-hidden">
          <form class="input-group mb-3" id="taskForm">
            <input type="text" id="taskInput" class="form-control" placeholder="Add a new task..." />
            <button class="btn btn-primary" type="submit"><i class="bi bi-plus-lg"></i></button>
          </form>
          <ul class="list-group" id="taskList">

          </ul>
        </div>
      </div>

    </div>

    <!-- RIGHT HALF: Video Container -->
    <div class="col-lg-6 col-md-6 h-100 d-flex">
      <div
        class="card border-0 shadow-sm dashboard-card w-100 overflow-hidden d-flex align-items-center justify-content-center bg-black">
        <video id="plantVideo" class="w-100 h-100 object-fit-cover" muted playsinline loop preload="auto">
          <source id="plantVideoSource" src="assets/videos/tree_growing.webm" type="video/webm">
        </video>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/study-dashboard.js"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
