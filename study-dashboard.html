<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - School Of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <link rel="stylesheet" href="assets/styles/tools.css" />
  <script type="module" src="./assets/components/navbar.js"></script>
</head>

<body>
  <nav-bar></nav-bar>

<!-- Top Layout Grid -->
    <main class="container-fluid flex-grow-1 p-3">
      <div class="row g-3 h-100">
        
        <!-- LEFT PANEL: Notes UI -->
        <div class="col-lg-3 col-md-4">
          <div class="card h-100 shadow-sm border-0 dashboard-card">
            <div class="card-header bg-white border-0 fw-bold fs-5 pt-3 pb-0">
              <i class="bi bi-journal-text me-2 text-primary"></i>Notes UI
            </div>
            <div class="card-body d-flex flex-column">
              <div class="input-group mb-3">
                <input type="text" id="noteInput" class="form-control" placeholder="Write a note..." />
                <button class="btn btn-primary" id="addNoteBtn"><i class="bi bi-plus-lg"></i></button>
              </div>
              <ul class="list-group list-group-flush flex-grow-1 overflow-auto pe-1" id="notesList">
                <!-- Notes will render here dynamically -->
              </ul>
            </div>
          </div>
        </div>

        <!-- CENTER PANEL: Timer UI & Plant Canvas -->
        <div class="col-lg-6 col-md-4 d-flex flex-column">
          <div class="card h-100 shadow-sm border-0 dashboard-card overflow-hidden">
            
            <!-- Adjustable Timer UI Controls -->
            <div class="card-header bg-white border-bottom p-3 text-center">
              <h4 class="fw-bold mb-2">Pomodoro Timer</h4>
              
              <!-- Timer Display with Increase / Decrease Controls -->
              <div class="d-flex align-items-center justify-content-center gap-3 my-2">
                <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="decreaseBtn" title="Decrease 5 min">
                  <i class="bi bi-dash-lg"></i>
                </button>
                <div class="display-3 fw-bold text-dark timer-num" id="timerDisplay">25:00</div>
                <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="increaseBtn" title="Increase 5 min">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>

              <!-- Time Adjustment Range Slider (5 to 45 mins) -->
              <div class="px-4 my-2">
                <input type="range" class="form-range" id="timeSlider" min="1" max="45" step="1" value="25">
                <div class="d-flex justify-content-between text-muted small px-1">
                  <span>5 min</span>
                  <span>25 min</span>
                  <span>45 min</span>
                </div>
              </div>

              <!-- Action Controls -->
              <div class="d-flex justify-content-center gap-2 mt-3">
                <button class="btn btn-success px-4" id="startBtn"><i class="bi bi-play-fill me-1"></i> Start</button>
                <button class="btn btn-warning text-white px-3" id="pauseBtn" disabled><i class="bi bi-pause-fill me-1"></i> Pause</button>
                <button class="btn btn-secondary px-3" id="resetBtn"><i class="bi bi-arrow-counterclockwise me-1"></i> Reset</button>
              </div>
            </div>

            <!-- Canvas Area for Growing Plant -->
            <div class="card-body p-0 flex-grow-1 position-relative bg-light d-flex align-items-center justify-content-center">
              <canvas id="plantCanvas" width="500" height="350"></canvas>
            </div>
            
          </div>
        </div>

        <!-- RIGHT PANEL: Task UI -->
        <div class="col-lg-3 col-md-4">
          <div class="card h-100 shadow-sm border-0 dashboard-card">
            <div class="card-header bg-white border-0 fw-bold fs-5 pt-3 pb-0">
              <i class="bi bi-check2-square me-2 text-primary"></i>Task UI
            </div>
            <div class="card-body d-flex flex-column">
              <div class="input-group mb-3">
                <input type="text" id="taskInput" class="form-control" placeholder="Add a new task..." />
                <button class="btn btn-primary" id="addTaskBtn"><i class="bi bi-plus-lg"></i></button>
              </div>
              <ul class="list-group list-group-flush flex-grow-1 overflow-auto pe-1" id="taskList">
                <!-- Tasks will render here dynamically -->
              </ul>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- BOTTOM PANEL: Spotify Bar -->
    <footer class="spotify-bar bg-dark text-white p-2 border-top">
      <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-spotify text-success fs-3"></i>
          <span class="fw-semibold">Spotify Widget</span>
        </div>
        <!-- Embedded Spotify Player Placeholder -->
        <div class="w-50">
          <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX8NTLI29BXZa?utm_source=generator" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
        <div class="text-muted small d-none d-md-block">Focus Playlist</div>
      </div>
    </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/study-dashboard.js"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
