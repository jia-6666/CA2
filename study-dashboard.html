<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - School Of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <link rel="stylesheet" href="assets/styles/tools.css" />
  <script type="module" src="./assets/components/navbar.js"></script>
</head>

<body class="d-flex flex-column vh-100">
  <nav-bar></nav-bar>

  <!-- Top Layout Grid -->
  <main class="container-fluid flex-grow-1 p-3">
    <div class="row g-3 h-100">

      <!-- LEFT PANEL: Notes UI -->
      <div class="col-lg-3 col-md-4 h-100">
        <div class="card h-100 shadow-sm border-0 dashboard-card d-flex flex-column">
          <div
            class="card-header bg-white border-0 fw-bold fs-5 pt-3 pb-2 d-flex justify-content-between align-items-center">
            <span><i class="bi bi-journal-text me-2 text-primary"></i>Notes</span>
            <button class="btn btn-primary btn-sm rounded-circle" id="openNoteModalBtn" title="Create Note">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          <div class="card-body overflow-auto pe-2">
            <ul class="list-group list-group-flush" id="notesList">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </div>
      </div>

      <!-- CENTER PANEL: Timer UI & Plant Canvas -->
      <div class="col-lg-6 col-md-4 d-flex flex-column h-100">
        <div class="card h-100 shadow-sm border-0 dashboard-card overflow-hidden d-flex flex-column">

          <!-- Timer UI Controls -->
          <div class="card-header bg-white border-bottom p-3 text-center">
            <h4 class="fw-bold mb-2">Pomodoro Timer</h4>

            <!-- Display Controls -->
            <div class="d-flex align-items-center justify-content-center gap-3 my-2">
              <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="decreaseBtn"
                title="Decrease 5 min">
                <i class="bi bi-dash-lg"></i>
              </button>
              <div class="display-3 fw-bold text-dark timer-num" id="timerDisplay">25:00</div>
              <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="increaseBtn"
                title="Increase 5 min">
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>

            <!-- Time Slider -->
            <div class="px-4 my-2">
              <input type="range" class="form-range" id="timeSlider" min="1" max="45" step="5" value="25">
              <div class="d-flex justify-content-between text-muted small px-1">
                <span>5 min</span>
                <span>25 min</span>
                <span>45 min</span>
              </div>
            </div>

            <!-- Inside the Pomodoro Timer Card Body/Header -->
            <div class="d-flex align-items-center justify-content-center gap-2 mt-2 mb-1">
              <label for="plantSelect" class="form-label small fw-semibold mb-0 text-muted">
                <i class="bi bi-flower1 text-success me-1"></i>Plant Type:
              </label>
              <select id="plantSelect" class="form-select form-select-sm w-auto fw-medium shadow-sm">
                <option value="tree" selected>🌳 Tree</option>
                <option value="wheat">🌾 Wheat</option>
                <option value="flower">🌸 Flower</option>
              </select>
            </div>

            <!-- Actions -->
            <div class="d-flex justify-content-center gap-2 mt-3">
              <button class="btn btn-success px-4" id="startBtn"><i class="bi bi-play-fill me-1"></i> Start</button>
              <button class="btn btn-warning text-white px-3" id="pauseBtn" disabled><i
                  class="bi bi-pause-fill me-1"></i> Pause</button>
              <button class="btn btn-secondary px-3" id="resetBtn"><i class="bi bi-arrow-counterclockwise me-1"></i>
                Reset</button>
            </div>
          </div>

          <!-- Canvas Container -->
          <div
            class="card-body p-0 flex-grow-1 position-relative bg-light d-flex align-items-center justify-content-center overflow-hidden">
            <canvas id="plantCanvas" width="500" height="350"></canvas>
          </div>

        </div>
      </div>

      <!-- RIGHT PANEL: Task UI -->
      <div class="col-lg-3 col-md-4 h-100">
        <div class="card h-100 shadow-sm border-0 dashboard-card d-flex flex-column">
          <div class="card-header bg-white border-0 fw-bold fs-5 pt-3 pb-2">
            <i class="bi bi-check2-square me-2 text-primary"></i>Tasks
          </div>
          <div class="card-body d-flex flex-column overflow-hidden">
            <div class="input-group mb-3">
              <input type="text" id="taskInput" class="form-control" placeholder="Add a new task..." />
              <button class="btn btn-primary" id="addTaskBtn"><i class="bi bi-plus-lg"></i></button>
            </div>
            <ul class="list-group list-group-flush flex-grow-1 overflow-auto pe-1" id="taskList">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Note Modal (Create / View) -->
  <div id="note-modal" class="modal hidden" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">Create Note</h5>
          <button type="button" class="btn-close" id="close-modal-btn" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="note-form">
            <div class="mb-3">
              <label for="note-title-input" class="form-label fw-semibold">Title</label>
              <input type="text" class="form-control" id="note-title-input" required placeholder="Enter note title...">
            </div>

            <div class="mb-3">
              <label for="note-text-input" class="form-label fw-semibold">Content</label>
              <textarea class="form-control" id="note-text-input" rows="4"
                placeholder="Enter note content..."></textarea>
            </div>

            <!-- Media Inputs -->
            <div id="media-inputs" class="mb-3">
              <label for="note-image-input" class="form-label small">Add Image</label>
              <input type="file" class="form-control mb-2" id="note-image-input" accept="image/*">

              <label for="note-video-input" class="form-label small">Add Video</label>
              <input type="file" class="form-control" id="note-video-input" accept="video/*">
            </div>

            <!-- Media Preview / View Container -->
            <div id="media-preview" class="media-preview d-flex flex-column gap-2 mb-3"></div>

            <button type="submit" class="btn btn-primary w-100" id="save-note-btn">Save Note</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- BOTTOM PANEL: Spotify Bar -->
  <footer class="spotify-bar bg-dark text-white p-2 border-top">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-spotify text-success fs-3"></i>
        <span class="fw-semibold">Spotify Widget</span>
      </div>
      <div class="w-50">
        <iframe style="border-radius:12px"
          src="https://open.spotify.com/embed/playlist/37i9dQZF1DX8NTLI29BXZa?utm_source=generator" width="100%"
          height="80" frameBorder="0" allowfullscreen=""
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      </div>
      <div class="text-muted small d-none d-md-block">Focus Playlist</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/study-dashboard.js"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
