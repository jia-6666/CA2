<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools - School Of Computing</title>
  <style>
    @view-transition {navigation: auto;
    }
  </style>
  <link rel="stylesheet" href="assets/styles/global.css" />
  <script type="module" src="assets/components/navbar.js"></script>
  <link rel="stylesheet" href="assets/styles/tools.css" />
</head>

<body class="d-flex flex-column vh-100">
  <nav-bar></nav-bar>

  <!-- Top Layout Grid -->
  <main class="container-fluid flex-grow-1 p-3">
    <div class="row g-3 h-100">

      <!-- CENTER PANEL: Timer UI & Plant Canvas -->
      <div
        class="col-lg-8 d-flex flex-column h-100 shadow-sm border-0 dashboard-card overflow-hidden gap-2">

        <!-- Timer UI Controls -->
        <div class="card bg-white border-bottom p-3 text-center">
          <h4 class="fw-bold mb-2">Pomodoro Timer</h4>

          <!-- Display Controls -->
          <div class="d-flex align-items-center justify-content-center gap-3 my-2">
            <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="decreaseBtn" title="Decrease 5 min">
              <i class="bi bi-dash-lg"></i>
            </button>
            <div class="display-3 fw-bold text-dark timer-num" id="timerDisplay">25:00</div>
            <button class="btn btn-outline-secondary rounded-circle btn-adjust" id="increaseBtn" title="Increase 5 min">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>

          <!-- Time Slider -->
          <div class="px-4 my-2">
            <input type="range" class="form-range" id="timeSlider" min="5" max="45" step="1" value="25">
            <div class="d-flex justify-content-between text-muted small px-1">
              <span>5 min</span>
              <span>25 min</span>
              <span>45 min</span>
            </div>
          </div>

          <!-- Inside the Pomodoro Timer Card Body/Header -->
          <div class="d-flex align-items-center justify-content-center gap-2 mt-2 mb-1">
            <label for="plantSelect" class="form-label small fw-semibold mb-0 text-muted">
              <i class="bi bi-flower1 text-success me-1"></i>Plant Type:
            </label>
            <select id="plantSelect" class="form-select form-select-sm w-auto fw-medium shadow-sm">
              <option value="tree" selected>🌳 Tree</option>
              <option value="wheat">🌾 Wheat</option>
              <option value="flower">🌸 Flower</option>
            </select>
          </div>

          <!-- Actions -->
          <div class="d-flex justify-content-center gap-2 mt-3">
            <button id="startBtn" class="btn btn-success px-4">Start</button>
            <button id="resetBtn" class="btn btn-outline-secondary">Reset</button>
          </div>
        </div>

        <!-- Plant Growth Animation Canvas -->
        <div
          class="card panel-card flex-grow-1 d-flex flex-column align-items-center justify-content-endoverflow-hidden position-relative"
          style="background-image: url(assets/farm.jpg); background-repeat: no-repeat; background-size: cover;">
          <video id="plantVideo" class="h-100" muted playsinline loop preload="auto">
            <source src="assets/is_it_possible_for_u_to_genera_3.webm" type="video/webm">
          </video>
        </div>
      </div>

      <!-- RIGHT PANEL: Task UI -->
      <div class="col-lg-4 h-100">
        <div class="card h-100 shadow-sm border-0 dashboard-card d-flex flex-column">
          <div class="card-header bg-white border-0 fw-bold fs-5 pt-3 pb-2">
            <i class="bi bi-check2-square me-2 text-primary"></i>Tasks
          </div>
          <div class="card-body d-flex flex-column overflow-hidden">
            <div class="input-group mb-3">
              <input type="text" id="taskInput" class="form-control" placeholder="Add a new task..." />
              <button class="btn btn-primary" id="addTaskBtn"><i class="bi bi-plus-lg"></i></button>
            </div>
            <ul class="list-group list-group-flush flex-grow-1 overflow-auto pe-1" id="taskList">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="assets/scripts/study-dashboard.js"></script>
  <script src="assets/scripts/recent-visits.js"></script>
</body>

</html>
